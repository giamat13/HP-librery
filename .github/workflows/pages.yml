# Publishes the static library page (librery.html) to GitHub Pages.
# The MCP server itself needs a server runtime and is deployed separately (Vercel, see README).
name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site folder
        run: |
          mkdir _site
          cp librery.html _site/
          echo '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=librery.html"><a href="librery.html">librery</a>' > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
